server:
  host: 0.0.0.0
  port: 8080

auth:
  mode: header
  headerPrefix: x-fieldscope-

connectors:
  - id: jira-prod
    name: Enterprise Jira
    protocol: http
    baseUrl: ${JIRA_BASE_URL:-https://jira.example.com}
    auth:
      type: bearer
      token: ${JIRA_API_TOKEN:-demo-jira-service-token}

  - id: crm-prod
    name: Enterprise CRM
    protocol: http
    baseUrl: ${CRM_BASE_URL:-https://crm.example.com}
    auth:
      type: header
      headerName: x-api-key
      value: ${CRM_API_KEY:-demo-crm-api-key}

policies:
  # 研发部员工通过 AI 查询 Jira 工单：限制返回条数、强制限定本部门项目、裁剪敏感字段并脱敏邮箱与正文 PII
  - id: policy-jira-eng-read
    name: Engineering Read Jira Issues
    effect: allow
    priority: 100
    match:
      principal:
        roles: ["employee"]
        attributes:
          department: "engineering"
      connector: jira-prod
    action:
      protocol: http
      methods: ["GET"]
      paths: ["/rest/api/3/search", "/rest/api/3/issue/*"]
    request:
      validate:
        - expr: "query.maxResults == null || query.maxResults <= 50"
          message: "单次最多查询 50 条工单（maxResults <= 50）"
      enforce:
        query.project: "{{ principal.attributes.projectKey }}"
    response:
      mode: allowlist
      fields:
        - "issues[*].key"
        - "issues[*].fields.summary"
        - "issues[*].fields.status.name"
        - "issues[*].fields.reporter.displayName"
        - "issues[*].fields.reporter.emailAddress"
        - "issues[*].fields.description"
      transforms:
        - path: "issues[*].fields.reporter.emailAddress"
          action: mask_email
        - path: "issues[*].fields.description"
          action: redact_pii

  # 显式禁止所有 AI 对任何连接器执行 DELETE 删除操作
  - id: policy-deny-all-deletes
    name: Deny All Delete Operations
    effect: deny
    priority: 999
    match:
      principal: {}
      connector: "*"
    action:
      protocol: http
      methods: ["DELETE"]
      paths: ["/**"]
